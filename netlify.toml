[build]
  publish = "dist"
  command = "npm run build && npm run build:lib"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache rules for Service Worker and PWA assets
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
