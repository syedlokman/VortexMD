<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- PBC Wireframe Edge Gradient -->
    <linearGradient id="pbcEdgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- 3D Specular Atom Spheres -->
    <radialGradient id="sphereBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>

    <radialGradient id="sphereRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <radialGradient id="sphereAmber" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <radialGradient id="sphereCyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>

    <radialGradient id="sphereEmerald" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </radialGradient>

    <radialGradient id="spherePurple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </radialGradient>
  </defs>

  <!-- Clean White Background Base (No border, No shadow, Edge-to-Edge) -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- ================= 1. MAXIMIZED PBC UNIT CELL (MD Simulation Box) ================= -->
  
  <!-- Back Hidden Dashed Edges for 3D Depth -->
  <g stroke="#cbd5e1" stroke-width="4.5" stroke-dasharray="10 10" stroke-linecap="round" stroke-linejoin="round">
    <line x1="256" y1="12" x2="256" y2="224" />
    <line x1="16" y1="362" x2="256" y2="224" />
    <line x1="496" y1="362" x2="256" y2="224" />
  </g>

  <!-- Front Solid Wireframe Faces with Translucent Fills -->
  <!-- Top Face -->
  <path d="M256 12 L496 150 L256 288 L16 150 Z" 
        stroke="url(#pbcEdgeGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="#eff6ff" fill-opacity="0.55"/>

  <!-- Left Face -->
  <path d="M16 150 L256 288 L256 500 L16 362 Z" 
        stroke="url(#pbcEdgeGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="#f8fafc" fill-opacity="0.4"/>

  <!-- Right Face -->
  <path d="M256 288 L496 150 L496 362 L256 500 Z" 
        stroke="url(#pbcEdgeGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="#f1f5f9" fill-opacity="0.45"/>

  <!-- PBC Unit Cell Corner Lattice Atoms -->
  <circle cx="256" cy="12" r="10" fill="#3b82f6"/>
  <circle cx="496" cy="150" r="10" fill="#3b82f6"/>
  <circle cx="16" cy="150" r="10" fill="#3b82f6"/>
  <circle cx="256" cy="288" r="11" fill="#60a5fa"/>
  <circle cx="16" cy="362" r="10" fill="#3b82f6"/>
  <circle cx="496" cy="362" r="10" fill="#3b82f6"/>
  <circle cx="256" cy="500" r="11" fill="#2563eb"/>

  <!-- ================= 2. SMALL MOLECULES (Ball-and-Stick Chemical Structures) ================= -->
  
  <!-- Inter-molecular Hydrogen Bonds & Non-covalent Interactions (Dashed Vectors) -->
  <g stroke-linecap="round">
    <line x1="200" y1="215" x2="230" y2="240" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="6 5" />
    <line x1="315" y1="230" x2="345" y2="200" stroke="#10b981" stroke-width="3.5" stroke-dasharray="6 5" />
    <line x1="280" y1="365" x2="300" y2="395" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="6 5" />
    <line x1="175" y1="310" x2="205" y2="310" stroke="#a855f7" stroke-width="3.5" stroke-dasharray="6 5" />
  </g>

  <!-- MOLECULE A: Prominent Central Aromatic / Heterocyclic Drug Molecule -->
  <!-- Covalent Chemical Bonds -->
  <g stroke="#334155" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 6-Membered Core Ring -->
    <polygon points="245,260 285,260 305,295 285,330 245,330 225,295" fill="none"/>
    <!-- Functional Branches & Substituents -->
    <line x1="285" y1="260" x2="305" y2="225" />
    <line x1="305" y1="225" x2="335" y2="225" />
    <line x1="305" y1="295" x2="338" y2="300" />
    <line x1="285" y1="330" x2="298" y2="365" />
    <line x1="225" y1="295" x2="195" y2="295" />
    <line x1="245" y1="260" x2="230" y2="230" />
  </g>
  <!-- 3D Atom Spheres -->
  <circle cx="245" cy="260" r="10" fill="url(#sphereCyan)"/>
  <circle cx="285" cy="260" r="10" fill="url(#sphereBlue)"/>
  <circle cx="305" cy="295" r="10" fill="url(#sphereCyan)"/>
  <circle cx="285" cy="330" r="10" fill="url(#sphereBlue)"/>
  <circle cx="245" cy="330" r="10" fill="url(#sphereCyan)"/>
  <circle cx="225" cy="295" r="10" fill="url(#sphereCyan)"/>
  <!-- Functional Group Atoms -->
  <circle cx="305" cy="225" r="9.5" fill="url(#sphereCyan)"/>
  <circle cx="335" cy="225" r="11" fill="url(#sphereRed)"/>
  <circle cx="338" cy="300" r="11" fill="url(#sphereEmerald)"/>
  <circle cx="298" cy="365" r="10.5" fill="url(#sphereRed)"/>
  <circle cx="195" cy="295" r="9" fill="url(#sphereBlue)"/>
  <circle cx="230" cy="230" r="9" fill="url(#sphereRed)"/>

  <!-- MOLECULE B: Upper-Right Cofactor / Ligand Compound -->
  <g stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 5-Membered Ring -->
    <polygon points="370,165 402,175 412,208 385,225 358,200" fill="none"/>
    <!-- Extension -->
    <line x1="412" y1="208" x2="442" y2="218" />
    <line x1="370" y1="165" x2="360" y2="135" />
  </g>
  <circle cx="370" cy="165" r="9" fill="url(#sphereBlue)"/>
  <circle cx="402" cy="175" r="9" fill="url(#sphereCyan)"/>
  <circle cx="412" cy="208" r="9.5" fill="url(#sphereBlue)"/>
  <circle cx="385" cy="225" r="9" fill="url(#sphereCyan)"/>
  <circle cx="358" cy="200" r="9" fill="url(#sphereCyan)"/>
  <circle cx="442" cy="218" r="11.5" fill="url(#sphereAmber)"/>
  <circle cx="360" cy="135" r="10" fill="url(#sphereRed)"/>

  <!-- MOLECULE C: Upper-Left Branched Small Molecule -->
  <g stroke="#334155" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="125" y1="210" x2="155" y2="195" />
    <line x1="155" y1="195" x2="185" y2="210" />
    <line x1="155" y1="195" x2="155" y2="165" />
    <line x1="185" y1="210" x2="200" y2="215" />
  </g>
  <circle cx="125" cy="210" r="8.5" fill="url(#sphereRed)"/>
  <circle cx="155" cy="195" r="9" fill="url(#sphereCyan)"/>
  <circle cx="185" cy="210" r="8.5" fill="url(#sphereCyan)"/>
  <circle cx="155" cy="165" r="10" fill="url(#spherePurple)"/>
  <circle cx="200" cy="215" r="8" fill="url(#sphereBlue)"/>

  <!-- MOLECULE D: Lower-Right Solvent / Small Ligand Cluster -->
  <g stroke="#334155" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="335" y1="395" x2="365" y2="385" />
    <line x1="365" y1="385" x2="395" y2="400" />
    <line x1="365" y1="385" x2="370" y2="355" />
  </g>
  <circle cx="335" cy="395" r="8.5" fill="url(#sphereCyan)"/>
  <circle cx="365" cy="385" r="9" fill="url(#sphereBlue)"/>
  <circle cx="395" cy="400" r="10.5" fill="url(#sphereEmerald)"/>
  <circle cx="370" cy="355" r="9.5" fill="url(#sphereRed)"/>

  <!-- MOLECULE E: Lower-Left Water / Triatomic Probe -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="145" y1="330" x2="130" y2="315" />
    <line x1="145" y1="330" x2="165" y2="320" />
  </g>
  <circle cx="145" cy="330" r="9.5" fill="url(#sphereRed)"/>
  <circle cx="130" cy="315" r="6.5" fill="url(#sphereCyan)"/>
  <circle cx="165" cy="320" r="6.5" fill="url(#sphereCyan)"/>

</svg>
