<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VortexMD Minimal Web Component Demo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    vortexmd-engine { flex: 1; width: 100%; }
    #bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid #ddd; background: #f8fafc; font-size: 13px; }
    #bar input[type="range"] { flex: 1; }
    #status { margin-left: auto; font-family: monospace; color: #334155; }
  </style>
</head>
<body>
  <!-- 1. Embed the standalone Web Component -->
  <vortexmd-engine id="viewer"></vortexmd-engine>

  <!-- 2. Minimal control bar -->
  <div id="bar">
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <input id="frame" type="range" min="1" max="1" value="1" />
    <label><input id="superpose" type="checkbox" /> Superpose</label>
    <button id="rmsd">Cα RMSD</button>
    <span id="status">Loading demo.pdb + demo.xtc...</span>
  </div>

  <!-- 3. Load component bundle and wire demo.pdb + demo.xtc -->
  <script type="module" src="./vortexmd-engine.js"></script>
  <script type="module">
    const viewer = document.getElementById('viewer');
    const slider = document.getElementById('frame');
    const status = document.getElementById('status');

    document.getElementById('play').onclick = () => viewer.play();
    document.getElementById('pause').onclick = () => viewer.pause();
    document.getElementById('superpose').onchange = (e) => viewer.setSuperpose(e.target.checked);
    slider.oninput = () => viewer.jumpToFrame(Number(slider.value));

    document.getElementById('rmsd').onclick = async () => {
      status.textContent = 'Computing Cα RMSD...';
      const run = await viewer.computeRmsd({ fit: 'protein and .CA', calc: 'protein and .CA' });
      status.textContent = `Cα RMSD: min ${run.stats.min} Å | max ${run.stats.max} Å | avg ${run.stats.avg} Å`;
    };

    viewer.addEventListener('indexing-complete', (e) => {
      slider.max = e.detail.totalFrames;
      viewer.setLoop(true);
      viewer.play();
    });

    viewer.addEventListener('frame-update', (e) => {
      slider.value = e.detail.frame;
      status.textContent = `Frame ${e.detail.frame} / ${viewer.frameCount} (${e.detail.physTimeFormatted})`;
    });

    // Auto-load demo.pdb and demo.xtc
    const pdb = new File([await (await fetch('./demo/demo.pdb')).blob()], 'demo.pdb');
    const xtc = new File([await (await fetch('./demo/demo.xtc')).blob()], 'demo.xtc');
    await viewer.loadTopology(pdb);
    await viewer.loadTrajectory(xtc);
  </script>
</body>
</html>
